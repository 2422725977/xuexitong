<body style="background:#f5f6f8">
<input type="hidden" id="fid" value="0">
        <p class="photo_tit">普通签到</p>

    </a>

<div class="maskDiv" style="display:none">

<script>
            document.title="签到"
    
    var fid_cookie = "0";

    $(document).ready(function(){
        var height1 = document.body.clientHeight;
        var width1 = document.body.clientWidth;
        var rate = height1/width1;
        if(rate < 1.5){
            //console.log("111");
            $('.conDiv').css('height','auto');
        }
        // 初始化签到验证码插件
        mySignCaptchaUtils.initSignCaptchaPlugin();
    });


    var name = "";
    var name2 = "";
    function getCurrentApplyUserInfo(object){
        $("#fid").val(object.fid);
        if(!object.name){
            object.name = "";
        }
        name = object.name;
        name2 = name;
        name = encodeURIComponent(name);
    }

    var deviceCode = "";//设备指纹
    function  _jsBridgeReady(){
        AppUtils.getUserInfo('',getCurrentApplyUserInfo);
        try {
            //CLIENT_DEVICE_FLAG 获取设备指纹
            jsBridge.bind('CLIENT_DEVICE_FLAG', function(object) {
                if (object && object.flagInfo) {
                    deviceCode = object.flagInfo.trim().replace(/[?&]/g, '');
                }
            });
            jsBridge.postNotification("CLIENT_DEVICE_FLAG", {});
        } catch (e) {
            console.log(e)
        }
    }



    var jsBridge_cmd_handlers = {};
    var PHOTO_RESULT = "";
    //新版打开相机
    function newOpenPhoto(){
        var param = {camare:"5","saveGallery":0,pubNetFlag: ServiceDomain.pubNetFlag,"uploadParams":{"_from":"mobilelearn"}};
        jsBridge.postNotification('CLIENT_CHOOSE_IMAGE',param);
        if (!jsBridge_cmd_handlers["CLIENT_CHOOSE_IMAGE_RESULT"]) {
            var handler=jsBridge_cmd_handlers["CLIENT_CHOOSE_IMAGE_RESULT"]=function (object) {
                //返回格式:{"files":[{"type":"image/jpeg","name":"xxx.jepg","data":"....."},{"type":"image/jpeg","name":"xxx.jepg","data":"....."}]}
                //新版返回的数据{"files":[{"name":"xxxx.jpg","objectid":"...","type":"jpg"}]}
                PHOTO_RESULT = object ? JSON.stringify(object) : "";
                if (object && object.files) {
                    //var imgArray = new Array();
                    //var num = $('#photoAreaId').find('img').length;
                    var imagedata = jQuery.parseJSON(object.files);
                    for(var i = 0; i<imagedata.length; i++){
                        if(i < (imagedata.length-1) ){
                            continue;
                        }

                        $('.message_camera').hide();
                        $('.imgDiv').show();
                        //$(".zmessage_change").show();

                        var imageName=imagedata[i].name;
                        var imageDate=imagedata[i].objectid;

                        if(!imageDate){
                            myalert("图片上传失败，请重新拍照上传");
                            return;
                        }

                        $("#image_1").attr("src","https://p.cldisk.com/star3/312_412c/"+ imageDate +".jpg");
                        $("#image_1").attr("href","https://p.cldisk.com/star3/origin/"+ imageDate +".jpg");
                        $("#image_1").attr("nvalue",imageDate);
                        $("#signButton").remove();

                        //图片上传后自动签到
                        setTimeout(function() {
                            sign();
                        }, 300);

                    }
                }
            };
            try {
                jsBridge.bind('CLIENT_CHOOSE_IMAGE_RESULT',handler);
            } catch (e) {
                myalert(e);
            }
        }
    }

    function myalert(text){
        $(".maskDiv dt").html(text);

        $(".maskDiv").show();
    }
    function cancelAlert(){
        $(".maskDiv").hide();
    }



    function  fanhui(){
        var acId="4000180998737";
        var role="";
        var uid='493228247';
        var url1="https://mobilelearn.chaoxing.com/newsign/preSign?courseId=269282723&classId=159926750&activePrimaryId=" + acId + "&uid="+ uid+"&role="+role+"&appType=15&isTeacherViewOpen=0";
        var opts = {"title":"签到", "checkLogin":"1", "loadType":"0" ,"webUrl":url1+"#INNER","toolbarType":"2"};
        jsBridge.postNotification('CLIENT_OPEN_URL', opts);

    }

    var chongfu=0;
    function sign(){
        var acId="4000180998737";

        var objectId = $("#image_1").attr("nvalue");
        if(objectId!=''&&typeof(objectId)!="undefined"){

            //判断这个设备是否已经签到过了
            var lskey = "pptactive"+acId;
            var lsvalue = window.localStorage[lskey];
            if(lsvalue){
                jsBridge.postNotification('CLIENT_DISPLAY_MESSAGE', {'message':"同一设备不允许重复签到！"});
                setTimeout("existNow()",1000);
                return;
            }

            if(chongfu>0){
                myalert("不能重复签到");
                return;
            }

            var uid='493228247';
            var latitude="-1";
            var longitude="-1";
            var ipss="";
            var fid=$("#fid").val();

            var url="/pptSign/stuSignajax?activeId=" + acId + "&courseId=269282723&uid="+ uid +"&clientip="+ipss+"&useragent="+ "&latitude="+latitude+
                    "&longitude="+longitude+"&appType=15&fid="+fid+"&objectId="+objectId+"&name="+name+"&validate="+mySignCaptchaUtils.VALIDATE_CODE_STR +
                    "&deviceCode=" + deviceCode;
            var  classId="159926750";

            var juli='';
            var appType='15';
            var params = urlParamsToObject(url);
            params.photoResult = PHOTO_RESULT;
            $.ajax({
                url: '/pptSign/stuSignajax',
                type: "post",
                data: params,
                success:function(res){
                    if(res=="validate"){
                        validateShow(url);
                        return;
                    }

                    if(res=="success"||res=="success2"){// success2 是结束了才签到
                        //签到成功，计入localStorage
                        var lskey = "pptactive"+acId;
                        if(!window.localStorage[lskey]){
                            window.localStorage[lskey] = name2+"   "+'493228247'+"  "+acId;
                        }

                        chongfu+=1;
                        if(res=="success"){//
                                                            jsBridge.postNotification('CLIENT_DISPLAY_MESSAGE', {'message':'恭喜你已完成签到'}) ;
                                                    }
                        if(res=="success2"){//
                            jsBridge.postNotification('CLIENT_DISPLAY_MESSAGE', {'message':'已过教师设置的截止时间'}) ;
                        }
                        setTimeout("fanhui()",1000);
                        return;
                    }else{
                        jsBridge.postNotification('CLIENT_DISPLAY_MESSAGE', {'message':res});
                        jsBridge.postNotification('CLIENT_EXIT_LEVEL', {});
                    }
                }
            });
        }else{
            myalert("请先拍照");
            return;
        }
    }

    function existNow(){
        jsBridge.postNotification('CLIENT_EXIT_LEVEL', {}) ;
    }

    function validateShow() {
        mySignCaptchaUtils.verifySuccessCallback = function (validate) {
            sign();
        };
        mySignCaptchaUtils.popUpCaptcha();
    }

    function urlParamsToObject(url) {
        //获取字符串 ? 后面的部分
        var queryString = url.split('?')[1];
        var paramsArr = queryString.split('&');
        var paramObj = {};

        paramsArr.forEach(param => {
            var idx = param.indexOf('=');
            if (idx != -1) {
                var key = param.substring(0, idx);
                var value = param.substring(idx + 1);
                paramObj[key] = decodeURIComponent(value);
            } else {
                paramObj[param] = undefined;
            }
        });

        return paramObj;
    }

</script>
